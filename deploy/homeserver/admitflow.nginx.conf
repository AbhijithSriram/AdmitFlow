# nginx site for AdmitFlow on the homeserver. Installed by deploy/homeserver/install.sh as
# /etc/nginx/sites-available/admitflow (symlinked into sites-enabled).
#
# Request path:  browser -> Cloudflare -> cloudflared tunnel -> this server (127.0.0.1:8088)
#                  /api/*        -> gunicorn on 127.0.0.1:5001
#                  /admitflow/*  -> MinIO on 127.0.0.1:9000 (time-limited signed file links)
#                  everything else -> the built React site
#
# Derived from nginx/nginx.conf in this repo (the generic production config). Keep the security
# headers and the rate limit in step with it. The differences are marked "HOMESERVER".

# Shared edge rate limit. Flask-Limiter keeps its counters per Gunicorn worker, so on its own it
# allows several times the intended rate; this one is shared by every worker.
limit_req_zone $binary_remote_addr zone=authlimit:10m rate=10r/m;
limit_req_status 429;

# HOMESERVER: the scheme the VISITOR used. Every request reaches nginx as plain http from cloudflared,
# including visits to http://, so the port cannot tell them apart. Cloudflare reports the visitor's
# scheme in CF-Visitor ({"scheme":"http"}) and in X-Forwarded-Proto; trust them for the same reason as
# CF-Connecting-IP below (only cloudflared can reach this loopback port). Requests with neither header
# (install.sh's own checks on the server) get an empty value and are left alone.
map $http_cf_visitor $af_visitor_scheme {
    default                  $http_x_forwarded_proto;
    "~\"scheme\":\"https\""  https;
    "~\"scheme\":\"http\""   http;
}

server {
    # HOMESERVER: loopback only. The only way in from outside is the Cloudflare tunnel.
    listen 127.0.0.1:8088;
    server_name admitflow.abhijith-sriram.in;

    # HOMESERVER: cloudflared connects from 127.0.0.1, so without this every visitor would look
    # like 127.0.0.1 and share ONE login rate-limit bucket (10 a minute for the whole internet).
    # Cloudflare puts the visitor's address in CF-Connecting-IP. Trusting it is safe because the
    # port is loopback-only: nothing but cloudflared can reach it to forge the header.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # HOMESERVER: a visitor on http:// is sent to https:// before anything else is served, so a login
    # page is never delivered (and a password never typed) over plain http. HSTS below only helps from
    # the second visit on; this covers the first. 301 is the permanent, cacheable redirect.
    if ($af_visitor_scheme = "http") {
        return 301 https://$server_name$request_uri;
    }

    # install.sh copies the build here (nginx runs as www-data and cannot read /home/abhijith).
    root /var/www/admitflow/frontend/dist;
    index index.html;
    server_tokens off;
    client_max_body_size 3m;             # largest upload is the 2 MB ID proof plus multipart overhead

    # HOMESERVER: static.cloudflareinsights.com / cloudflareinsights.com are Cloudflare's own web
    # analytics beacon, which the Cloudflare edge injects into every page served through the tunnel.
    # They are allowed here so it is not reported as a blocked script; turning Web Analytics off
    # in the Cloudflare dashboard makes them unnecessary.

    # ---- Security headers (single source of truth) -------------------------------------
    # The API's own copies are hidden in the /api blocks below so nothing is sent twice.
    # NOTE: never put add_header inside a location block that should keep these: it silently
    # discards them. The MinIO block below does so on purpose.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://cdn.razorpay.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://static.cloudflareinsights.com; frame-src https://api.razorpay.com https://www.google.com/recaptcha/; connect-src 'self' https://api.postalpincode.in https://lumberjack.razorpay.com https://cloudflareinsights.com; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # HOMESERVER: browsers always see https (Cloudflare terminates TLS), so HSTS is meaningful here.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ---- Rate-limited auth endpoints: 10 requests/min per visitor, burst of 5 -----------
    location ~ ^/api/(auth/login|auth/signup|auth/send-otp|auth/verify-otp|admin/login)$ {
        limit_req zone=authlimit burst=5 nodelay;
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite: never trust a client-supplied value
        proxy_set_header X-Forwarded-Proto https;        # HOMESERVER: the visitor is on https even though this hop is http
        proxy_read_timeout 30s;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Strict-Transport-Security;
    }

    # ---- Everything else under /api -> Gunicorn ----------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # HOMESERVER: confirming a payment renders the application PDF and sends the email
        # inside the request, so allow longer than the generic config's 30 s.
        proxy_read_timeout 60s;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Strict-Transport-Security;
    }

    # ---- HOMESERVER: signed file links -> MinIO ----------------------------------------
    # Receipts and the admin's document links are presigned URLs of the form
    #   https://admitflow.abhijith-sriram.in/admitflow/<object>?X-Amz-Signature=...
    # (the first path segment is the bucket name; the app signs them for this host because
    # MINIO_PUBLIC_ENDPOINT is set). The Host header is passed through unchanged, which is what
    # lets MinIO verify the signature. The bucket is private: a request without a valid,
    # unexpired signature gets 403, and only GET/HEAD are allowed at all.
    location ^~ /admitflow/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:9000;
        # $http_host, not $host: it is the Host header exactly as the browser sent it (with a
        # port if there was one), which is what the link was signed for.
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
        # These are applicant-uploaded files (validated PNG/PDF, served with the type we stored).
        # The page CSP above does not suit a downloaded PDF, and add_header in a location
        # replaces the inherited ones, so set the two that matter here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # The brochure is generated from the admin-edited site content (GET /api/content/brochure); old
    # links and cached pages still point at the static file it replaced.
    location = /brochure.pdf {
        return 301 /api/content/brochure;
    }

    # ---- Built assets: long cache (Vite fingerprints the filenames) ---------------------
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    # ---- React static build: client-side routing fallback ------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
