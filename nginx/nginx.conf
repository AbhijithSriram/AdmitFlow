# AdmitFlow site config. Install as /etc/nginx/sites-available/admitflow and symlink it
# into sites-enabled (that directory is included inside http{}, so limit_req_zone below is valid).
# After any change:  sudo nginx -t && sudo systemctl reload nginx

# Shared edge rate limit. Flask-Limiter keeps its counters per Gunicorn worker, so with 4
# workers its "10/minute" can become up to 40/minute. Nginx enforces the real shared cap.
limit_req_zone $binary_remote_addr zone=authlimit:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;                       # set to the real hostname

    root /var/www/admitflow/frontend/dist;
    index index.html;
    server_tokens off;
    client_max_body_size 3m;             # largest upload is the 2 MB ID proof plus multipart overhead

    # ---- Security headers (single source of truth) -------------------------------------
    # The API's own copies are hidden in the /api blocks below so nothing is sent twice.
    # NOTE: never put add_header inside a location block - it silently discards these.
    # Presigned MinIO URLs (receipts, admin document links) are opened in a new tab, never embedded,
    # so they need no CSP entry. If previews are ever embedded, add the MinIO origin to img-src/frame-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://cdn.razorpay.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; frame-src https://api.razorpay.com https://www.google.com/recaptcha/; connect-src 'self' https://api.postalpincode.in https://lumberjack.razorpay.com; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # Strict-Transport-Security is only honoured over HTTPS: set it in the 443 block at the bottom.

    # ---- Rate-limited auth endpoints: 10 requests/min per IP, burst of 5 ----------------
    location ~ ^/api/(auth/login|auth/signup|auth/send-otp|auth/verify-otp|admin/login)$ {
        limit_req zone=authlimit burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite: never trust a client-supplied value
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Strict-Transport-Security;
    }

    # ---- Everything else under /api -> Gunicorn ----------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Strict-Transport-Security;
    }

    # ---- Built assets: long cache (Vite fingerprints the filenames) ---------------------
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    # ---- React static build: client-side routing fallback ------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# -------------------------------------------------------------------------------------
# HTTPS (strongly recommended). Needed for HSTS and for Secure cookies: in production
# Flask marks the session cookies Secure, which browsers will NOT store over plain HTTP
# (except on localhost). Uncomment after obtaining a certificate.
